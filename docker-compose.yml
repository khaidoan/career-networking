# Production-style stack: built images for postgres, jobs, frontend and nginx.
#   cp .env.example .env   # then fill in the values
#   docker compose up --build
# The app is served on http://localhost:8080; nginx is the only service with a host port.
name: career-networking

# Healthcheck timings shared by every service (keep identical to dev-docker-compose.yml).
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 5

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${CAREER_NETWORKING_DATABASE_DBNAME:?set CAREER_NETWORKING_DATABASE_DBNAME in .env}
      POSTGRES_USER: ${CAREER_NETWORKING_DATABASE_USERNAME:?set CAREER_NETWORKING_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${CAREER_NETWORKING_DATABASE_PASSWORD:?set CAREER_NETWORKING_DATABASE_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *healthcheck-timing
      start_period: 10s

  jobs:
    build: ./backend/jobs
    restart: unless-stopped
    env_file: .env
    # The image runs `alembic upgrade head` and then uvicorn on 0.0.0.0:8000.
    volumes:
      - ./backend/data/resume:/opt/career_networking/resume
      - ./backend/data/jobs:/opt/career_networking/jobs
      - ./backend/logs:/opt/career_networking/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4)"
      <<: *healthcheck-timing
      start_period: 30s

  # Job fetcher: the jobs image running `python -m src.fetcher` every 30 minutes
  # (backend/jobs/crontab). Waits for a healthy jobs service, which has applied the migrations.
  # Fetch now, by hand: docker compose exec fetcher python -m src.fetcher
  fetcher:
    build: ./backend/jobs
    restart: unless-stopped
    env_file: .env
    # [UNCONFIRMED: D6] supercronic is the scheduler.
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    volumes:
      - ./backend/data/resume:/opt/career_networking/resume
      - ./backend/data/jobs:/opt/career_networking/jobs
      - ./backend/logs:/opt/career_networking/logs
    depends_on:
      jobs:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    # The frontend only needs the JWT secret (to verify cn_session in proxy.ts), so it is the
    # only value passed from .env; the database and login secrets stay out of this container.
    environment:
      CAREER_NETWORKING_JWT_SECRET: ${CAREER_NETWORKING_JWT_SECRET:?set CAREER_NETWORKING_JWT_SECRET in .env}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      <<: *healthcheck-timing
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jobs:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      <<: *healthcheck-timing
      start_period: 10s

volumes:
  postgres_data:
