[project]
name = "career-networking-jobs"
version = "0.1.0"
description = "Career Networking jobs service (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "fastapi>=0.115",
    "httpx>=0.27",
    "langgraph>=0.2",
    "litellm>=1.50",
    "pdfminer.six>=20240706",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pyyaml>=6.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "N"]

[tool.ruff.lint.isort]
known-first-party = ["src"]
# The local alembic/ migrations folder would otherwise shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.format]
quote-style = "double"
