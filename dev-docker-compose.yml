# Development stack with hot reload (standalone file, not an override):
#   docker compose -f dev-docker-compose.yml up --build
# App on http://localhost:8080 (Next.js HMR and uvicorn --reload); Postgres on localhost:5432
# for local tools and the migration tests.
name: career-networking-dev

# Healthcheck timings shared by every service (keep identical to docker-compose.yml).
x-healthcheck-timing: &healthcheck-timing
  interval: 10s
  timeout: 5s
  retries: 5

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${CAREER_NETWORKING_DATABASE_DBNAME:?set CAREER_NETWORKING_DATABASE_DBNAME in .env}
      POSTGRES_USER: ${CAREER_NETWORKING_DATABASE_USERNAME:?set CAREER_NETWORKING_DATABASE_USERNAME in .env}
      POSTGRES_PASSWORD: ${CAREER_NETWORKING_DATABASE_PASSWORD:?set CAREER_NETWORKING_DATABASE_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      <<: *healthcheck-timing
      start_period: 10s

  jobs:
    build: ./backend/jobs
    env_file: .env
    # Source is bind-mounted over /app; the virtualenv lives at /opt/venv inside the image,
    # so the bind mount never hides it.
    command:
      - sh
      - -c
      - >-
        alembic upgrade head &&
        exec uvicorn --factory src.main:create_app --host 0.0.0.0 --port 8000
        --reload --reload-dir src
    volumes:
      - ./backend/jobs:/app
      - ./backend/data/resume:/opt/career_networking/resume
      - ./backend/data/jobs:/opt/career_networking/jobs
      - ./backend/logs:/opt/career_networking/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=4)"
      <<: *healthcheck-timing
      start_period: 30s

  # Job fetcher: the jobs image running `python -m src.fetcher` every 30 minutes
  # (backend/jobs/crontab). Waits for a healthy jobs service, which has applied the migrations.
  # Fetch now, by hand:
  #   docker compose -f dev-docker-compose.yml exec fetcher python -m src.fetcher
  fetcher:
    build: ./backend/jobs
    env_file: .env
    # [UNCONFIRMED: D6] supercronic is the scheduler; each run imports the mounted source.
    command: ["supercronic", "-passthrough-logs", "/app/crontab"]
    volumes:
      - ./backend/jobs:/app
      - ./backend/data/resume:/opt/career_networking/resume
      - ./backend/data/jobs:/opt/career_networking/jobs
      - ./backend/logs:/opt/career_networking/logs
    depends_on:
      jobs:
        condition: service_healthy

  frontend:
    # The Dockerfile's `deps` stage has Node, pnpm and the installed node_modules.
    build:
      context: ./frontend
      target: deps
    command: ["pnpm", "dev", "--hostname", "0.0.0.0", "--port", "3000"]
    # Only the JWT secret is needed (proxy.ts verifies cn_session); other secrets stay out.
    environment:
      CAREER_NETWORKING_JWT_SECRET: ${CAREER_NETWORKING_JWT_SECRET:?set CAREER_NETWORKING_JWT_SECRET in .env}
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./frontend:/app
      # Container-owned node_modules and build cache so host files are never shadowed or
      # overwritten.
      - frontend_node_modules_dev:/app/node_modules
      - frontend_next_dev:/app/.next
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      <<: *healthcheck-timing
      start_period: 30s

  nginx:
    image: nginx:1.28-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/conf.d/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      jobs:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/health"]
      <<: *healthcheck-timing
      start_period: 10s

volumes:
  postgres_data_dev:
  frontend_node_modules_dev:
  frontend_next_dev:
