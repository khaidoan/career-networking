# Reverse proxy for Career Networking (plain HTTP; published on host port 8080).
#   /health  -> answered by nginx itself
#   /api/    -> jobs service (FastAPI), path kept unchanged
#   /        -> frontend (Next.js), including /login and /logout
# Serving the API and the app from one origin keeps the cn_session cookie same-origin.

# WebSocket upgrade support (Next.js HMR in the dev stack).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    # Shared proxy headers. $http_host keeps the port (localhost:8080) so redirects stay correct.
    # X-Real-IP is always overwritten with the connecting address, so clients cannot spoof it;
    # the jobs service rate-limits failed logins per X-Real-IP.
    proxy_http_version 1.1;
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    location /api/ {
        # No trailing slash: the request path is forwarded unchanged (/api/v1/...).
        proxy_pass http://jobs:8000;
    }

    location / {
        proxy_pass http://frontend:3000;
        # Long-lived HMR websocket in dev.
        proxy_read_timeout 1h;
    }
}
